name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore WinTilix.sln

      - name: Build
        run: dotnet build WinTilix.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test WinTilix.sln --configuration Release --no-build --no-restore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest

    permissions:
      contents: write

    env:
      SM_HOST: ${{ vars.SM_HOST }}
      SM_API_KEY: ${{ secrets.SM_API_KEY }}
      SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
      SM_KEYPAIR_ALIAS: ${{ vars.SM_KEYPAIR_ALIAS }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release tags must use the form v1.2.3."
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Detect DigiCert signing configuration
        id: signing
        shell: pwsh
        run: |
          $configured = -not [string]::IsNullOrWhiteSpace($env:SM_API_KEY) `
            -and -not [string]::IsNullOrWhiteSpace($env:SM_HOST) `
            -and -not [string]::IsNullOrWhiteSpace($env:SM_CLIENT_CERT_PASSWORD) `
            -and -not [string]::IsNullOrWhiteSpace("${{ secrets.SM_CLIENT_CERT_FILE_B64 }}") `
            -and -not [string]::IsNullOrWhiteSpace($env:SM_KEYPAIR_ALIAS)

          if ($configured) {
            Write-Host "DigiCert Software Trust signing is configured."
            "enabled=true" >> $env:GITHUB_OUTPUT
          }
          else {
            Write-Host "DigiCert signing secrets/vars are not fully configured; releasing an unsigned installer."
            Write-Host "SmartScreen will show Unknown publisher until Buffalo Analytics code signing is set up."
            "enabled=false" >> $env:GITHUB_OUTPUT
          }

      - name: Publish self-contained application
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"

          dotnet publish src/WinTilix/WinTilix.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output artifacts/publish `
            -p:Version=$version `
            -p:DebugType=None `
            -p:DebugSymbols=false

          dotnet publish tools/WinTilix.PtyHost/WinTilix.PtyHost.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output artifacts/publish `
            -p:Version=$version `
            -p:DebugType=None `
            -p:DebugSymbols=false

          if (-not (Test-Path "artifacts/publish/WinTilix.exe")) {
            throw "Published output is missing WinTilix.exe."
          }
          if (-not (Test-Path "artifacts/publish/WinTilix.PtyHost.exe")) {
            throw "Published output is missing WinTilix.PtyHost.exe."
          }

      - name: Prepare DigiCert client certificate
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          echo "${{ secrets.SM_CLIENT_CERT_FILE_B64 }}" | base64 --decode > /d/Certificate_pkcs12.p12

      - name: Sign WinTilix.exe
        if: steps.signing.outputs.enabled == 'true'
        uses: digicert/code-signing-software-trust-action@v1
        with:
          simple-signing-mode: true
          input: ${{ github.workspace }}\artifacts\publish\WinTilix.exe
          keypair-alias: ${{ vars.SM_KEYPAIR_ALIAS }}
          digest-alg: SHA256
          timestamp: true
          fail-fast: true
        env:
          SM_HOST: ${{ vars.SM_HOST }}
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_FILE: D:\Certificate_pkcs12.p12
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}

      - name: Sign WinTilix.PtyHost.exe
        if: steps.signing.outputs.enabled == 'true'
        uses: digicert/code-signing-software-trust-action@v1
        with:
          simple-signing-mode: true
          input: ${{ github.workspace }}\artifacts\publish\WinTilix.PtyHost.exe
          keypair-alias: ${{ vars.SM_KEYPAIR_ALIAS }}
          digest-alg: SHA256
          timestamp: true
          fail-fast: true
        env:
          SM_HOST: ${{ vars.SM_HOST }}
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_FILE: D:\Certificate_pkcs12.p12
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress --yes
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not installed."
          }

      - name: Build Windows installer
        id: installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $publishDir = (Resolve-Path "artifacts/publish").Path
          & $iscc `
            "/DAppVersion=${{ steps.version.outputs.value }}" `
            "/DPublishDir=$publishDir" `
            "installer/WinTilix.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

          $installer = Get-ChildItem "artifacts/installer/*.exe" | Select-Object -First 1
          if ($null -eq $installer) {
            throw "Installer EXE was not produced."
          }
          Write-Host "Installer: $($installer.FullName) ($([math]::Round($installer.Length / 1MB, 1)) MB)"
          "path=$($installer.FullName)" >> $env:GITHUB_OUTPUT

      - name: Sign Windows installer
        if: steps.signing.outputs.enabled == 'true'
        uses: digicert/code-signing-software-trust-action@v1
        with:
          simple-signing-mode: true
          input: ${{ steps.installer.outputs.path }}
          keypair-alias: ${{ vars.SM_KEYPAIR_ALIAS }}
          digest-alg: SHA256
          timestamp: true
          fail-fast: true
        env:
          SM_HOST: ${{ vars.SM_HOST }}
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_FILE: D:\Certificate_pkcs12.p12
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinTilix-${{ steps.version.outputs.value }}-win-x64
          path: artifacts/installer/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/installer/*.exe
