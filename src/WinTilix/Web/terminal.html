<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="xterm.css" />
  <style>
    html, body, #terminal {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #1c1c1c;
      overflow: hidden;
    }
    .xterm-viewport { overflow-y: auto !important; }
  </style>
</head>
<body>
  <div id="terminal"></div>
  <script src="xterm.js"></script>
  <script src="xterm-addon-fit.js"></script>
  <script>
    const term = new Terminal({
      cursorBlink: true,
      fontFamily: "Cascadia Mono, Consolas, Courier New, monospace",
      fontSize: 13,
      theme: {
        background: "#1c1c1c",
        foreground: "#e0e0e0",
        cursor: "#4ecdc4",
        selectionBackground: "#3a5f5c"
      }
    });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(document.getElementById("terminal"));

    function post(msg) {
      if (window.chrome && chrome.webview) {
        chrome.webview.postMessage(JSON.stringify(msg));
      }
    }

    term.onData((data) => post({ type: "input", data }));
    term.onResize((size) => post({ type: "resize", cols: size.cols, rows: size.rows }));
    term.onSelectionChange(() => {
      const selection = term.getSelection();
      if (selection) {
        post({ type: "copy", data: selection });
      }
    });
    term.element.addEventListener("contextmenu", (ev) => {
      ev.preventDefault();
      post({ type: "paste-request" });
      term.focus();
    });
    term.attachCustomKeyEventHandler((ev) => {
      if (!ev.ctrlKey || !ev.shiftKey || ev.altKey || ev.type !== "keydown") {
        return true;
      }
      if (ev.code === "KeyC") {
        const selection = term.getSelection();
        if (selection) {
          post({ type: "copy", data: selection });
        }
        return false;
      }
      if (ev.code === "KeyV") {
        post({ type: "paste-request" });
        return false;
      }
      const commands = { KeyE: "split-right", KeyO: "split-down", KeyW: "close", KeyI: "toggle-sync" };
      const name = commands[ev.code];
      if (!name) {
        return true;
      }
      post({ type: "command", name });
      return false;
    });

    function fitNow() {
      try { fit.fit(); } catch (e) {}
    }

    window.addEventListener("resize", fitNow);
    new ResizeObserver(fitNow).observe(document.body);

    chrome.webview.addEventListener("message", (event) => {
      const msg = typeof event.data === "string" ? JSON.parse(event.data) : event.data;
      if (msg.type === "output") {
        const bin = atob(msg.data);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        term.write(bytes);
      } else if (msg.type === "clear") {
        term.reset();
      } else if (msg.type === "focus") {
        term.focus();
      } else if (msg.type === "paste") {
        if (typeof msg.data === "string" && msg.data.length > 0) {
          term.paste(msg.data);
        }
      }
    });

    setTimeout(() => {
      fitNow();
      post({ type: "ready", cols: term.cols, rows: term.rows });
    }, 50);
  </script>
</body>
</html>
